name: One-time R13 EasyEDA metadata correction

on:
  push:
    paths:
      - ".github/workflows/r13-metadata-fix.yml"

permissions:
  contents: write

jobs:
  correct-r13-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Correct R13 metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          import zipfile

          archive = Path("design/ESPFlight_Hardware_Reference_v1.0_EasyEDA_Source.zip")
          readme = Path("design/README.md")
          pcb_name = "1-PCB_PCB.json"

          old_sha256 = "876164299499c7eddd6da02b3eaf02faebfa2f2027e284bb83c3caee09396821"
          old_blob = "b3708b0960879348ee7bdf14bb1cc9d795362e14"

          replacements = [
              ("q=C269691&%26type=1", "q=C17513&%26type=1"),
              ("Supplier Part`C269691`", "Supplier Part`C17513`"),
              ("Manufacturer`Tyohm(\\u5e78\\u4e9a\\u7535\\u963b)`", "Manufacturer`UNI-ROYAL(\\u539a\\u58f0)`"),
              ("Manufacturer Part`RMC06033.3K5%N`", "Manufacturer Part`0805W8F1001T5E`"),
              ("JLCPCB Part Class`Extended Part`spicePre`R`spiceSymbolName`RMC06033.3K5%N`",
               "JLCPCB Part Class`Basic Part`spicePre`R`spiceSymbolName`0805W8F1001T5E`"),
          ]

          with zipfile.ZipFile(archive, "r") as zin:
              infos = zin.infolist()
              members = {info.filename: zin.read(info.filename) for info in infos}

          expected_names = {
              "1-PCB_PCB.json",
              "1-Schematic_ESPFlight Hardware Reference v1.0.json",
              "README.txt",
          }
          assert set(members) == expected_names, set(members)

          pcb_before_bytes = members[pcb_name]
          pcb_before = pcb_before_bytes.decode("utf-8")
          parsed_before = json.loads(pcb_before)

          schematic_hash_before = hashlib.sha256(
              members["1-Schematic_ESPFlight Hardware Reference v1.0.json"]
          ).hexdigest()
          embedded_readme_hash_before = hashlib.sha256(members["README.txt"]).hexdigest()

          for old, new in replacements:
              count = pcb_before.count(old)
              assert count == 1, f"Expected exactly one occurrence of {old!r}, found {count}"
              assert pcb_before.count(new) == 0, f"New value already present unexpectedly: {new!r}"

          pcb_after = pcb_before
          for old, new in replacements:
              pcb_after = pcb_after.replace(old, new, 1)

          parsed_after = json.loads(pcb_after)

          assert parsed_before.keys() == parsed_after.keys()
          assert len(parsed_before["shape"]) == len(parsed_after["shape"])
          changed_shapes = [
              i for i, (a, b) in enumerate(zip(parsed_before["shape"], parsed_after["shape"]))
              if a != b
          ]
          assert changed_shapes == [243], changed_shapes

          # Geometry and routing primitives must remain unchanged.
          for token in ("TRACK~", "PAD~", "VIA~", "COPPERAREA~"):
              assert pcb_before.count(token) == pcb_after.count(token), token

          for old, new in replacements:
              assert old not in pcb_after
              assert pcb_after.count(new) == 1

          members[pcb_name] = pcb_after.encode("utf-8")

          fd, tmp_name = tempfile.mkstemp(prefix="espflight-r13-", suffix=".zip")
          os.close(fd)
          try:
              with zipfile.ZipFile(tmp_name, "w") as zout:
                  for info in infos:
                      zout.writestr(info, members[info.filename])
              os.replace(tmp_name, archive)
          finally:
              if os.path.exists(tmp_name):
                  os.unlink(tmp_name)

          # Verify non-PCB embedded files stayed byte-identical.
          with zipfile.ZipFile(archive, "r") as zcheck:
              assert hashlib.sha256(
                  zcheck.read("1-Schematic_ESPFlight Hardware Reference v1.0.json")
              ).hexdigest() == schematic_hash_before
              assert hashlib.sha256(zcheck.read("README.txt")).hexdigest() == embedded_readme_hash_before

              check_text = zcheck.read(pcb_name).decode("utf-8")
              check_obj = json.loads(check_text)
              assert len(check_obj["shape"]) == len(parsed_before["shape"])
              for token in ("TRACK~", "PAD~", "VIA~", "COPPERAREA~"):
                  assert pcb_before.count(token) == check_text.count(token)

          new_sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
          new_blob = subprocess.check_output(
              ["git", "hash-object", str(archive)], text=True
          ).strip()

          text = readme.read_text(encoding="utf-8")
          assert old_sha256 in text
          assert old_blob in text
          text = text.replace(old_sha256, new_sha256, 1)
          text = text.replace(old_blob, new_blob, 1)

          correction_note = """
### R13 metadata correction

On 2026-10-02, the GitHub-hosted editable EasyEDA snapshot received a metadata-only correction for `R13`.

The PCB geometry, routing, pads, vias, copper areas, schematic, and embedded project README were not changed. The correction updates the PCB component metadata to match the already-authoritative v1.0 BOM:

- value: `1 kΩ`;
- package: `R0805`;
- manufacturer part: `0805W8F1001T5E`;
- manufacturer: `UNI-ROYAL`;
- LCSC part: `C17513`;
- JLCPCB classification: `Basic Part`.

The validated Gerber, BOM, and Pick-and-Place files in the official `v1.0` release remain unchanged and authoritative.
"""

          anchor = "## Release provenance"
          assert anchor in text
          if "### R13 metadata correction" not in text:
              text = text.replace(anchor, correction_note.strip() + "\n\n" + anchor, 1)

          readme.write_text(text, encoding="utf-8")

          print(f"Corrected archive SHA-256: {new_sha256}")
          print(f"Corrected archive Git blob SHA: {new_blob}")
          print("Changed EasyEDA shape index: 243 only")
          PY

      - name: Commit corrected snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/ESPFlight_Hardware_Reference_v1.0_EasyEDA_Source.zip design/README.md
          git diff --cached --quiet && exit 1
          git commit -m "Correct R13 EasyEDA source metadata"
          git push origin HEAD:main
